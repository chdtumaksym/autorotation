name: Build DLL
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
    - name: Compile
      run: cl.exe /LD /O2 /D "WIN32" /D "_WINDOWS" /D "_USRDLL" roguerot.cpp /link /OUT:roguerot.dll gdi32.lib user32.lib /MACHINE:X86
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: roguerot-dll
        path: roguerot.dll
